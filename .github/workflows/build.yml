name: Node.js CI

on:
  push:
    branches: [ develop, refactor/ecs ]
  pull_request:
    branches: [ develop, refactor/ecs ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: package.json
    - run: npm ci
    - run: npm run test:refactor
    - run: npm run build:ecs
    - run: npm run test:worker-bundle
    - run: gulp public
    - run: gulp copyWebsite
    - run: node tools/check-published-config.cjs docs
    - run: gulp scripts
    - run: npm run eslint
    - run: npm run stylelint
    - run: npm run vitest
